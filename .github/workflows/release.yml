name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify release tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION." >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - name: Generate synthetic 10k performance fixture
        run: npm run make:fixture:10k
      - name: Performance regression check
        env:
          PERF_FIXTURE: tests/fixtures/generated-10k.zip
          PERF_CONVERSATIONS: '10000'
          PERF_IMPORT_TIMEOUT_MS: '240000'
        run: npm run test:performance
      - name: Build offline package
        shell: bash
        run: GITHUB_REF_NAME="$RELEASE_TAG" npm run make:offline
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace an immutable release." >&2
            exit 1
          fi

          if [[ "$RELEASE_TAG" == *-* ]]; then
            cat > release-notes.md <<'EOF'
          This is an iPad validation release candidate for ChatGPT Export Profiler.

          Recommended iPad validation path:
          1. Open the GitHub Pages deployment in Safari and Orion.
          2. Import a medium synthetic export and verify portrait/landscape behavior.
          3. Test background/recovery, export, deletion, and offline/PWA launch.
          4. Report any device-only issue before the final v1.0.0 release.

          The ZIP asset attached to this release is the same validated static build packaged for local/offline serving. It can be downloaded directly from the GitHub Release page without PowerShell.
          EOF
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG — iPad validation build" --prerelease --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --generate-notes
          fi
      - name: Attach offline package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "artifacts/ChatGPT-Export-Profiler-${RELEASE_TAG#v}-offline.zip"
