name: Implementation Check

on:
  push:
    branches:
      - implementation/v1

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Domain RED/GREEN test
        run: npm test -- tests/unit/domain.test.ts
      - name: UI smoke RED/GREEN test
        if: ${{ hashFiles('src/analysis/domain.ts') != '' }}
        run: |
          npx playwright install --with-deps chromium webkit
          npm run e2e -- tests/e2e/smoke.spec.ts
      - name: Full Task 1 static checks
        if: ${{ hashFiles('src/app/App.tsx') != '' }}
        run: |
          npm run typecheck
          npm run lint
          npm run build

# implementation branch only; replaced by ci.yml in Task 14
