name: Implementation Check

on:
  push:
    branches:
      - implementation/v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and integration tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install E2E browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Chromium import timing diagnostic
        run: npx playwright test tests/e2e/import-flow.spec.ts --project=chromium --timeout=60000

# implementation branch only; replaced by ci.yml in Task 14
